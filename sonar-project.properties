sonar.projectKey=kurkle_chartjs-chart-treemap
sonar.organization=kurkle

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=chartjs-chart-treemap

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/,scripts/,docs/,bench/,.github/workflows
# docs/src/generated is written by docs/scripts/write-docs-version.cjs at build time.
sonar.exclusions=**/*.test.*,docs/src/generated/**
sonar.tests=test/

sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/browser/lcov.info

# Build and maintenance scripts, the documentation site and the benchmarks are analysed for issues but have no unit tests.
sonar.coverage.exclusions=scripts/**,docs/**,bench/**

# The floating v1 tag is deliberate: it is how a fix in kurkle/configs reaches
# every repository without a pull request in each one. Pinning a commit SHA
# would defeat that mechanism.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml

# `!(x > 0)` also rejects undefined and NaN, which `x <= 0` would let through.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1940
sonar.issue.ignore.multicriteria.e2.resourceKey=src/layout.ts

# `group` and `getGroupKey` are public API (re-exported via `export * from './utils.js'` in src/index.ts); changing the signature or type would break users.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=src/utils.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7770
sonar.issue.ignore.multicriteria.e4.resourceKey=src/utils.ts

# The tests are generated by `createFixtures`, which Sonar cannot see.
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.e5.resourceKey=test/specs/fixtures.spec.js
